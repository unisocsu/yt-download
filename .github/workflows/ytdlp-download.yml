name: Backup YouTube Channel

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "כתובת ערוץ, פלייליסט או סרטון בודד. אפשר כמה כתובות, מופרדות ברווח או בפסיק"
        required: true
        type: string
      mode:
        description: "מה להוריד"
        required: true
        type: choice
        default: video
        options:
          - video            # וידאו בלבד (mp4)
          - audio_mp3        # אודיו בלבד: מורידים את זרם האודיו ומקודדים ל-mp3
          - video_and_mp3    # מורידים וידאו, שומרים אותו, ומקודדים ממנו גם mp3

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      URLS: ${{ inputs.urls }}
      MODE: ${{ inputs.mode }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # yt-dlp צריך סביבת JavaScript כדי לחלץ סרטונים מיוטיוב
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install yt-dlp and ffmpeg
        run: |
          pip install -U "yt-dlp[default]" bgutil-ytdlp-pot-provider
          sudo apt-get update && sudo apt-get install -y ffmpeg

      # שירות שמייצר PO tokens, שיוטיוב דורשת מכתובות של שרתי ענן
      - name: Start PO token provider
        run: |
          docker run --name bgutil-provider -d -p 4416:4416 --init brainicism/bgutil-ytdlp-pot-provider
          sleep 10

      # שומר את רשימת הסרטונים שכבר הורדו, כדי שבכל הרצה יורדו רק חדשים
      # לכל מצב יש רשימה נפרדת (archive-<mode>.txt), כדי שסרטון שירד כוידאו
      # לא ידולג כשמבקשים אותו אחר כך כ-mp3
      - name: Restore download archive
        uses: actions/cache/restore@v4
        with:
          path: archive-*.txt
          key: yt-archive-${{ github.run_id }}
          restore-keys: yt-archive-

      # אופציונלי: קובץ cookies של החשבון שלך (בפורמט Netscape) כסוד בשם cookies
      # יוטיוב לעיתים חוסמת כתובות של שרתי ענן, וה-cookies עוזרים בזה
      - name: Prepare cookies
        env:
          COOKIES: ${{ secrets.cookies }}
        run: |
          if [ -z "$COOKIES" ]; then
            echo "::error::חסר הסוד cookies. יוטיוב חוסמת הורדות משרתי GitHub בלי cookies. ראה הנחיות להוספה בהגדרות הריפו."
            exit 1
          fi
          printf '%s\n' "$COOKIES" > cookies_raw.txt
          # אם הקובץ בפורמט JSON (כמו שתוספים רבים מייצאים), ממירים אותו ל-Netscape
          python3 - <<'PY'
          import json, sys
          raw = open("cookies_raw.txt", encoding="utf-8").read().strip()
          if raw[:1] in "[{":
              data = json.loads(raw)
              if isinstance(data, dict):
                  data = data.get("cookies", [])
              lines = ["# Netscape HTTP Cookie File"]
              for c in data:
                  domain = c.get("domain", "")
                  sub = "TRUE" if domain.startswith(".") else "FALSE"
                  secure = "TRUE" if c.get("secure") else "FALSE"
                  exp = c.get("expirationDate", c.get("expires", 0)) or 0
                  prefix = "#HttpOnly_" if c.get("httpOnly") else ""
                  lines.append("\t".join([
                      prefix + domain, sub, c.get("path", "/"), secure,
                      str(int(exp)), c.get("name", ""), c.get("value", "")]))
              open("cookies.txt", "w", encoding="utf-8").write("\n".join(lines) + "\n")
              print(f"Converted {len(data)} cookies from JSON to Netscape")
          else:
              open("cookies.txt", "w", encoding="utf-8").write(raw + "\n")
          PY
          rm -f cookies_raw.txt

      - name: Download channel
        run: |
          # מפצל את הכתובות (רווח, פסיק או שורה חדשה) לרשימה
          mapfile -t URL_LIST < <(printf '%s' "$URLS" | tr ' ,' '\n\n' | sed '/^[[:space:]]*$/d')
          echo "Mode: $MODE, downloading ${#URL_LIST[@]} URL(s)"

          case "$MODE" in
            audio_mp3)
              # מורידים רק את זרם האודיו הטוב ביותר ומקודדים ל-mp3
              MODE_ARGS=(
                --format "ba/b"
                --extract-audio --audio-format mp3 --audio-quality 0
                --embed-metadata --embed-thumbnail --convert-thumbnails jpg
              )
              ;;
            video_and_mp3)
              # מורידים וידאו, שומרים את קובץ ה-mp4 (-k) ומקודדים ממנו גם mp3
              MODE_ARGS=(
                --format "bv*[height<=1080]+ba/b[height<=1080]"
                --merge-output-format mp4
                --extract-audio --audio-format mp3 --audio-quality 0 --keep-video
                --write-thumbnail
                --write-subs --sub-langs "all,-live_chat"
              )
              ;;
            *)
              MODE_ARGS=(
                --format "bv*[height<=1080]+ba/b[height<=1080]"
                --merge-output-format mp4
                --write-thumbnail
                --write-subs --sub-langs "all,-live_chat"
              )
              ;;
          esac

          yt-dlp \
            --no-playlist \
            --cookies cookies.txt \
            --js-runtimes node \
            --download-archive "archive-$MODE.txt" \
            "${MODE_ARGS[@]}" \
            --write-info-json \
            --write-description \
            --ignore-errors \
            --retries 5 \
            --sleep-requests 1.5 \
            --sleep-interval 10 --max-sleep-interval 25 \
            --output "backup/%(upload_date)s - %(title).150B [%(id)s].%(ext)s" \
            "${URL_LIST[@]}"

      - name: Remove cookies
        if: always()
        run: rm -f cookies.txt

      # נשמר גם אם ההורדה נכשלה חלקית, כדי שסרטונים שירדו לא יורדו שוב
      - name: Save download archive
        if: always()
        uses: actions/cache/save@v4
        with:
          path: archive-*.txt
          key: yt-archive-${{ github.run_id }}

      # רץ גם אם חלק מההורדות נכשלו, כדי לא לאבד את מה שכבר ירד
      - name: Upload backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-backup-${{ github.run_number }}
          path: backup/
          retention-days: 30
          if-no-files-found: ignore
