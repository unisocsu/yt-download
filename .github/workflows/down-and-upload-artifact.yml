name: Chromium DOM download

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube video/page URL to open in Chromium'
        required: true
        type: string
      prepare_selector:
        description: 'Optional CSS selector to click before the download button'
        required: false
        type: string
        default: ''
      download_selector:
        description: 'CSS selector for the userscript download button'
        required: true
        type: string
        default: 'button.ytdl-fab'
      script_url:
        description: 'HTTPS URL of the userscript to inject before page scripts'
        required: true
        type: string
        default: 'https://raw.githubusercontent.com/tsoolgee/yt-download/main/userscript/yt-download.user.js'
      timeout_seconds:
        description: 'Timeout for navigation and download (30–900 seconds)'
        required: true
        type: number
        default: 180

permissions:
  contents: read

concurrency:
  group: chromium-download-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Do not enable pip caching: this repository has no requirements.txt or pyproject.toml.

      - name: Install Chromium and Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run browser download
        env:
          DOWNLOAD_URL: ${{ inputs.url }}
          PREPARE_SELECTOR: ${{ inputs.prepare_selector }}
          DOWNLOAD_SELECTOR: ${{ inputs.download_selector }}
          SCRIPT_URL: ${{ inputs.script_url }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: python scripts/playwright_download.py

      - name: Verify downloaded file
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [p for p in Path("downloads").iterdir() if p.is_file() and p.name != "failure.png"]
          if not files:
              raise SystemExit("No file was saved in downloads/")
          for path in files:
              if path.stat().st_size <= 0:
                  raise SystemExit(f"Empty output file: {path.name}")
              print(f"Verified: {path.name} ({path.stat().st_size:,} bytes)")
          PY

      - name: Upload downloaded file
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: downloads/*
          if-no-files-found: error
          retention-days: 3
