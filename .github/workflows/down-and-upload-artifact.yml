name: Run yt-dlp

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL להורדה'
        required: true
        type: string

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Deno (JavaScript runtime for YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Chromium browser for diagnostics
        run: |
          python -m pip install --upgrade playwright
          python -m playwright install --with-deps chromium

      - name: Test Chromium can open YouTube
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              response = page.goto("https://www.youtube.com/", wait_until="domcontentloaded", timeout=60000)
              print(f"YouTube HTTP status: {response.status if response else 'no response'}")
              print(f"Page title: {page.title()}")
              print(f"Final URL: {page.url}")
              browser.close()
          PY

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]"

      - name: Download media
        env:
          VIDEO_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          mkdir -p downloads
          yt-dlp \
            --no-playlist \
            --windows-filenames \
            --paths downloads \
            --output "%(title).180B [%(id)s].%(ext)s" \
            --print after_move:filepath \
            "$VIDEO_URL"
          if ! find downloads -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "::error::yt-dlp completed without creating a media file."
            exit 1
          fi

      - name: Upload downloaded media
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-media
          path: downloads/*
          if-no-files-found: error
          retention-days: 3
